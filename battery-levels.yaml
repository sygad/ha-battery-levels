# Battery Levels - complete view, ready to paste
#
# Dashboard > three-dot menu > Edit dashboard > three-dot menu > Raw
# configuration editor, then add this under `views:`.
#
# This file is the single source of truth for the whole recipe.
# Each part is explained in its own folder:
#   Part 1 - Floor section   parts/01-floor-section/
#   Part 2 - Room card       parts/02-room-card/
#   Part 3 - Battery row     parts/03-battery-row/
#
# Search for CHANGE and replace every one before using it.
# ---------------------------------------------------------------------------

title: Battery Levels
path: battery-levels
icon: mdi:battery-alert-variant-outline
type: sections
max_columns: 3
sections:
- type: grid
  column_span: 3
  background:
    color: accent
    opacity: 10
  cards:
  - type: custom:mushroom-title-card
    title: Top Floor        # CHANGE: your floor name
    grid_options:
      columns: full
      rows: auto
    card_mod:
      style: |-
        :host {
          --mush-title-padding: 4px 8px;
        }
  - type: custom:auto-entities
    show_empty: false
    sort:
      method: state
      numeric: true
    card:
      type: entities
      title: Attic Dorma        # CHANGE: the room name you want displayed
      show_header_toggle: false
      card_mod:
        style: |-
          .card-header {
            font-size: 18px !important;
          }
    filter:
      include:
      - area: Attic Dorma        # CHANGE: must match your area registry EXACTLY
        domain: sensor
        attributes:
          device_class: battery
          unit_of_measurement: '%'
        options:
          type: custom:bar-card
          entity_row: true
          height: 30px
          width: 38%
          decimal: 1
          unit_of_measurement: '%'
          min: 0
          max: 100
          positions:
            icon: outside
            name: outside
            value: inside
            indicator: 'off'
            minmax: 'off'
          severity:
          - from: 25
            to: 100
            color: '#66bb6a'
            icon: mdi:battery
          - from: 10
            to: 25
            color: var(--warning-color)
            icon: mdi:battery-30
          - from: 0
            to: 10
            color: var(--error-color)
            icon: mdi:battery-alert
          card_mod:
            style: |-
              {% set v = states(config.entity) | float(-1) %}
              {% set c = '--disabled-color' if v < 0 else ('--error-color' if v <= 10 else ('--warning-color' if v <= 25 else '--success-color')) %}
              #states {
                padding: 13px 14px 13px 16px !important;
              }
              bar-card-card {
                margin-right: 0 !important;
              }
              bar-card-backgroundbar,
              bar-card-currentbar,
              bar-card-contentbar,
              bar-card-targetbar,
              bar-card-animationbar {
                border-radius: 0 4px 4px 0 !important;
              }
              bar-card-iconbar {
                color: var({{ c }}) !important;
                width: 24px !important;
                height: 24px !important;
              }
              bar-card-iconbar ha-icon,
              bar-card-iconbar ha-state-icon {
                color: var({{ c }}) !important;
                --mdc-icon-color: var({{ c }}) !important;
              }
              bar-card-name {
                margin: 0 0 0 14px !important;
                font-size: 15px !important;
              }
              bar-card-value {
                margin-right: 12px !important;
                font-size: 14px !important;
                color: var(--primary-text-color) !important;
              }
      # CHANGE: these match rechargeable devices in THIS house. Swap them for
      # substrings of your own, or delete this whole exclude block.
      exclude:
      - entity_id: sensor.*iphone*
      - entity_id: sensor.*pixel*
      - entity_id: sensor.*mbp*
      - entity_id: sensor.*macbook*
      - entity_id: sensor.*wall_panel*
      - entity_id: sensor.*robovac*
  - type: custom:auto-entities
    show_empty: false
    sort:
      method: state
