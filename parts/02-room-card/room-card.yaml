# Part 2 · Room card
# Explained in: parts/02-room-card/README.md
# Where it goes: inside a floor section's `cards:` list, one copy per room
#                (see parts/01-floor-section/section.yaml).
# Needs:         custom:auto-entities, custom:bar-card, card-mod
#
# Search this file for CHANGE.

type: custom:auto-entities

# Hide the whole card when a room has no batteries, so empty rooms
# don't leave a titled box with nothing in it.
show_empty: false

# Lowest battery first, numerically. Without `numeric: true` the states are
# sorted as strings and 100 lands before 29.
sort:
  method: state
  numeric: true

# The container. This is a plain entities card used only for its title and
# frame - every row inside it is replaced by a bar-card (Part 3).
card:
  type: entities
  title: Attic Dorma          # CHANGE: the room name, exactly as in your area registry
  show_header_toggle: false
  card_mod:
    style: |-
      .card-header {
        font-size: 18px !important;
      }

filter:
  include:
    # One include block = one rule. `area` makes this self-maintaining:
    # add a battery device to this room and its row appears on its own.
    - area: Attic Dorma       # CHANGE: same room name as the title above
      domain: sensor
      attributes:
        device_class: battery
        unit_of_measurement: "%"

      # ---------------------------------------------------------------
      # THE KEY BIT. `options` is usually used to set an icon or a name.
      # It actually accepts an ENTIRE card config. auto-entities merges
      # `entity: <id>` into it for every match and hands the result to the
      # entities card as a custom row. That is how each battery becomes a
      # bar-card. Full annotation: parts/03-battery-row/battery-row.yaml
      # ---------------------------------------------------------------
      options:
        type: custom:bar-card
        entity_row: true
        height: 30px
        width: 38%
        decimal: 1
        unit_of_measurement: "%"
        min: 0
        max: 100
        positions:
          icon: outside
          name: outside
          value: inside
          indicator: "off"
          minmax: "off"
        severity:
          # Descending: bounds are inclusive and the LAST match wins.
          - from: 25
            to: 100
            color: "#66bb6a"
            icon: mdi:battery
          - from: 10
            to: 25
            color: var(--warning-color)
            icon: mdi:battery-30
          - from: 0
            to: 10
            color: var(--error-color)
            icon: mdi:battery-alert
        card_mod:
          style: |-
            {% set v = states(config.entity) | float(-1) %}
            {% set c = '--disabled-color' if v < 0 else ('--error-color' if v <= 10 else ('--warning-color' if v <= 25 else '--success-color')) %}
            #states {
              padding: 13px 14px 13px 16px !important;
            }
            bar-card-card {
              margin-right: 0 !important;
            }
            bar-card-backgroundbar,
            bar-card-currentbar,
            bar-card-contentbar,
            bar-card-targetbar,
            bar-card-animationbar {
              border-radius: 0 4px 4px 0 !important;
            }
            bar-card-iconbar {
              color: var({{ c }}) !important;
              width: 24px !important;
              height: 24px !important;
            }
            bar-card-iconbar ha-icon,
            bar-card-iconbar ha-state-icon {
              color: var({{ c }}) !important;
              --mdc-icon-color: var({{ c }}) !important;
            }
            bar-card-name {
              margin: 0 0 0 14px !important;
              font-size: 15px !important;
            }
            bar-card-value {
              margin-right: 12px !important;
              font-size: 14px !important;
              color: var(--primary-text-color) !important;
            }
            /* Cosmetic only - strips the trailing "Battery" from the displayed
               name. The entities are NOT renamed. See parts/03-battery-row/. */
            {% set fn = state_attr(config.entity,'friendly_name') %}
            {% set nm = fn | replace(' Battery Level','') | replace(' Battery level','') | replace(' Battery','') | trim %}
            bar-card-name {
              font-size: 0 !important;
            }
            bar-card-name::after {
              content: "{{ nm if nm else fn }}";
              font-size: 15px !important;
            }

  # Keep out anything that charges itself - phones, tablets, laptops, robot
  # vacuums, wearables. They report a battery percentage but they are never
  # something you walk over and replace a cell in, so mixing them in makes
  # "3 low batteries" meaningless.
  exclude:
    # CHANGE: these patterns match device names in THIS house. Replace them
    # with substrings from your own rechargeable devices' entity IDs, or
    # delete the whole exclude block if you want everything listed.
    - entity_id: sensor.*iphone*
    - entity_id: sensor.*pixel*
    - entity_id: sensor.*mbp*
    - entity_id: sensor.*macbook*
    - entity_id: sensor.*wall_panel*
    - entity_id: sensor.*robovac*
